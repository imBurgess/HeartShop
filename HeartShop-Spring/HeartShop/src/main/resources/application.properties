# ====================================
# Server ??
# ====================================
server.port=8080
server.servlet.context-path=/api

# ====================================
# Application ??
# ====================================

spring.application.name=HeartShop

# ====================================
# Database ??
# ====================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:heartshop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
# ====================================
# HikariCP ?????
# ====================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# ====================================
# MyBatis ??
# ====================================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.HeartShop.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.cache-enabled=true
mybatis.configuration.lazy-loading-enabled=true
mybatis.configuration.aggressive-lazy-loading=false
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
# ====================================
# Logging ??
# ====================================
logging.level.root=INFO
logging.level.com.HeartShop=DEBUG
logging.level.com.HeartShop.mapper=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ====================================
# JWT 設定
# ====================================
jwt.secret=${JWT_SECRET:HeartShop-Super-Secret-Key-For-Development-Environment-Change-This-In-Production-64Bytes}
jwt.expiration=604800000

# ====================================
# 檔案上傳設定
# ====================================
# 單個檔案最大 10MB
spring.servlet.multipart.max-file-size=10MB
# 整個請求最大 10MB
spring.servlet.multipart.max-request-size=10MB

# ====================================
# 前端網址（付款完成後導回用）
# ====================================
app.frontend-url=http://localhost:3000

